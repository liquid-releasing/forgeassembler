[pytest]
# Collect THIS project's tests and nothing else.
#
# `python -m pytest` with no path walks the whole tree. That is harmless in a
# working copy, and it broke the v0.2.6-alpha release build: CI stages the
# frozen PyInstaller backend into
# `ui/web/src-tauri/resources/forge-cli/_internal/` BEFORE the test step runs,
# so a bare run collected matplotlib's and numpy's OWN test suites out of the
# bundle and failed the build on their missing fixtures -- a baseline image
# directory that only exists in a source checkout of matplotlib, and
# `hypothesis`, which numpy's conftest imports and we have no reason to
# install.
#
# It cannot be reproduced locally, because that directory exists only during a
# release build. Hence a config file rather than a path argument in the
# workflow: the next person to type `pytest` at the root should get the same
# answer CI does.
testpaths = tests

# Belt and braces for anything else that lands in the tree: a vendored bundle,
# a node_modules, a build artifact. None of them hold tests of ours.
norecursedirs =
    ui
    dist
    build
    node_modules
    .git
    __pycache__
    *.egg-info
